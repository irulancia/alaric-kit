<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox</title>
<link rel="stylesheet" href="../configurator/configurator.css" />
<style>
  /* The same family as backlog.html (--cfg-* tokens, the 1200px cap, its pill and its field): the
     note box is the backlog's search field grown to a textarea, Save is its active pill. */
  :root { --radius: 10px; }
  * { box-sizing: border-box; }
  body { line-height: 1.5; padding: 40px 24px 64px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--cfg-muted); text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { color: var(--cfg-text); }
  h1 { font-size: 1.9rem; font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.24em; }
  h2 { font-size: 1rem; margin: 28px 0 8px; color: var(--cfg-muted); }
  .lead { color: var(--cfg-muted); font-size: 0.9rem; margin: 0 0 20px; max-width: 70ch; }
  .lead code { overflow-wrap: anywhere; }
  .note {
    background: var(--cfg-surface); border: 1px solid var(--cfg-border); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 6px;
  }
  .note-when { font-size: 0.75rem; color: var(--cfg-muted); }
  .note-text { font-size: 0.9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--cfg-muted); font-size: 0.9rem; padding: 8px 0; }
  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    background: var(--cfg-surface); border: 1px solid var(--cfg-border); border-radius: var(--radius);
    padding: 10px 12px; font: inherit; font-size: 0.95rem; color: var(--cfg-text);
  }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px; }
  .pill {
    border-radius: 999px; padding: 6px 18px; font: inherit; font-size: 0.85rem; cursor: pointer;
    background: var(--cfg-surface); border: 1px solid var(--cfg-border); color: var(--cfg-text);
  }
  .pill.primary { background: var(--cfg-text); border-color: var(--cfg-text); color: var(--cfg-bg); }
  .pill:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 0.85rem; color: var(--cfg-muted); }
  .status.error { color: var(--cfg-error); }
  .hint { font-size: 0.75rem; color: var(--cfg-muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../../dashboard.html">&larr; Dashboard</a>
  <h1><span id="project"></span> Inbox</h1>
  <p class="lead">Notes for Claude, in any language and any shape — ideas, questions, things to drop or change. Each one is added to
    <code id="project-path">memory/inbox.md</code> with its date. Claude moves them into the backlog and removes them from here.</p>

  <div class="actions" id="connect-row" hidden>
    <button type="button" class="pill primary" id="connect"></button>
    <span class="status" id="connect-why"></span>
  </div>

  <h2 id="pending-title">Waiting for Claude</h2>
  <div id="pending"></div>

  <h2>New note</h2>
  <textarea id="text" placeholder="Write anything…"></textarea>
  <div class="actions">
    <button type="button" class="pill primary" id="save" disabled>Save</button>
    <span class="hint">Ctrl + Enter</span>
    <span class="status" id="status" role="status"></span>
  </div>
</div>
<script>
// The page reads and writes ONE file, memory/inbox.md, through the browser's File System Access API
// (Chrome / Edge). It only ever APPENDS a note: what is already in the file is never rewritten by
// hand here, so nothing can be lost from this page. The file handle is remembered in IndexedDB so
// the file is chosen once; the browser still asks for permission once per session.
const FILE_NAME = 'inbox.md';
const HEADER = '# Inbox\n\nNotes for Claude, in any language. Claude moves them into memory/backlog.md and deletes them from here.\n';
const NOT_OPEN = 'Open the inbox (the button above) to see what is waiting.';
// The remembered file is keyed by this page's own project folder. Chrome gives every file:// page
// the same origin, so with one shared key an pages/inbox.html from one project reused the file chosen
// last in another (a note written in one project landed in another's inbox).
const PAGE_SUFFIX = /\/\.claude\/scripts\/pages\/inbox\.html$/;
const WINDOWS_DRIVE = /^\/([A-Za-z]:)/;   // file:///C:/… has a slash before the drive letter
const PROJECT_DIR = decodeURIComponent(location.pathname).replace(PAGE_SUFFIX, '').replace(WINDOWS_DRIVE, '$1');
const PROJECT_NAME = PROJECT_DIR.split('/').filter(Boolean).pop() || PROJECT_DIR;
const DB = { name: 'kit-inbox', store: 'handles', key: `inbox:${PROJECT_DIR}` };
const $ = (id) => document.getElementById(id);
let handle = null;

function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open(DB.name, 1);
    open.onupgradeneeded = () => open.result.createObjectStore(DB.store);
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const req = fn(open.result.transaction(DB.store, mode).objectStore(DB.store));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    };
  });
}
// Remembering the file is a convenience: if storage is unavailable — or never answers, as on some
// file:// pages — the file is simply chosen again.
const IDB_WAIT_MS = 1500;
const orGiveUp = (p) => Promise.race([p, new Promise((resolve) => setTimeout(() => resolve(null), IDB_WAIT_MS))]).catch(() => null);
const rememberHandle = (h) => orGiveUp(idb('readwrite', (s) => s.put(h, DB.key)));
const recallHandle = () => orGiveUp(idb('readonly', (s) => s.get(DB.key)));

function setStatus(text, isError = false) {
  $('status').textContent = text;
  $('status').classList.toggle('error', isError);
}

function stamp(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// "## <when>" starts a note; everything up to the next one is its text.
function parseNotes(md) {
  const parts = md.replace(/\r\n/g, '\n').split(/^## (.+)$/m);
  const notes = [];
  for (let i = 1; i < parts.length; i += 2) notes.push({ when: parts[i].trim(), text: parts[i + 1].trim() });
  return notes;
}

function renderNotes(notes, emptyText = 'Nothing waiting — everything is in the backlog.') {
  $('pending-title').textContent = notes.length ? `Waiting for Claude (${notes.length})` : 'Waiting for Claude';
  const list = $('pending');
  list.replaceChildren();
  if (!notes.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = emptyText;
    list.append(empty);
    return;
  }
  notes.forEach((n) => {
    const card = document.createElement('div');
    card.className = 'note';
    const when = document.createElement('div');
    when.className = 'note-when';
    when.textContent = n.when;
    const text = document.createElement('div');
    text.className = 'note-text';
    text.textContent = n.text;   // textContent: a note is shown as written, never as markup
    card.append(when, text);
    list.append(card);
  });
}

async function readInbox() {
  const file = await handle.getFile();
  return file.text();
}

async function showInbox() {
  renderNotes(parseNotes(await readInbox()));
  $('connect-row').hidden = true;
  $('save').disabled = false;
}

async function hasPermission(ask) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return ask && (await handle.requestPermission(opts)) === 'granted';
}

function askToConnect(label, why) {
  $('connect').textContent = label;
  $('connect-why').textContent = why;
  $('connect-row').hidden = false;
  $('save').disabled = true;
}

async function chooseFile() {
  const [picked] = await window.showOpenFilePicker({ types: [{ description: 'Inbox', accept: { 'text/markdown': ['.md'] } }] });
  if (picked.name !== FILE_NAME) {
    askToConnect('Choose memory/inbox.md', `That was ${picked.name} — the inbox is memory/${FILE_NAME} in ${PROJECT_NAME}.`);
    return;
  }
  handle = picked;
  await rememberHandle(handle);
  await showInbox();
}

async function onConnect() {
  try {
    if (handle && (await hasPermission(true))) await showInbox();
    else await chooseFile();
  } catch (e) {
    if (e.name !== 'AbortError') setStatus(`Couldn't open the inbox: ${e.message}`, true);
  }
}

async function onSave() {
  const text = $('text').value.trim();
  if (!text) { setStatus('Nothing to save yet.'); return; }
  if (!handle || $('save').disabled) { setStatus('Open the inbox first (the button above).', true); return; }
  try {
    if (!(await hasPermission(true))) { setStatus('The browser did not allow writing to the inbox.', true); return; }
    const current = (await readInbox()).replace(/\s+$/, '');
    const next = `${current || HEADER.trimEnd()}\n\n## ${stamp()}\n${text}\n`;   // read again first: Claude may have emptied it
    const out = await handle.createWritable();
    await out.write(next);
    await out.close();
    $('text').value = '';
    renderNotes(parseNotes(next));
    setStatus(`Saved ${stamp()}.`);
  } catch (e) {
    setStatus(`Not saved — ${e.message}. Your note is still in the box.`, true);
  }
}

async function init() {
  if (!('showOpenFilePicker' in window)) {
    askToConnect('Open in Chrome or Edge', 'This browser can\'t save to a file — open this page in Chrome or Edge.');
    $('connect').disabled = true;
    renderNotes([], NOT_OPEN);
    return;
  }
  handle = await recallHandle();
  if (handle && (await hasPermission(false))) { await showInbox(); return; }
  renderNotes([], NOT_OPEN);
  if (handle) askToConnect('Open the inbox', 'The browser asks once per session before this page can read and write the inbox.');
  else askToConnect('Choose memory/inbox.md', `Once: pick the inbox file in ${PROJECT_NAME}'s memory folder.`);
}

// The browser never reveals a chosen file's folder, so the page can't check it; it names the
// project it belongs to instead, so a file picked from the wrong project is easy to notice.
function showProject() {
  document.title = `${PROJECT_NAME} Inbox`;
  $('project').textContent = PROJECT_NAME;
  $('project-path').textContent = `${PROJECT_DIR}/memory/${FILE_NAME}`;
}

showProject();
$('connect').addEventListener('click', onConnect);
$('save').addEventListener('click', onSave);
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) onSave(); });
init().catch((e) => setStatus(`Couldn't start: ${e.message}`, true));
</script>
</body>
</html>

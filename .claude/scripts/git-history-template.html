<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Git History</title>
<link rel="stylesheet" href=".claude/scripts/design-system-configurator.css" />
<style>
  /* --cfg-* and --cat-* tokens (colors, dark mode) come from design-system-configurator.css,
     shared with the configurator, the dashboard and backlog.html, so all four read as one
     family instead of four hand-copied palettes drifting apart. */
  :root {
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* Subtle depth, not a new color: darkens the same --cfg-bg toward black rather than
       introducing a literal hex value. Fixed so it reads against the viewport, not the (taller)
       page content. */
    background: linear-gradient(180deg, var(--cfg-bg) 0%, color-mix(in srgb, var(--cfg-bg), black 14%) 100%) fixed;
    color: var(--cfg-text);
    font-family: var(--cfg-font);
    line-height: 1.5;
    padding: 40px 24px 64px;
  }
  /* Capped, unlike the configurator: that's a sidebar+canvas tool that legitimately wants the
     full viewport for live editing, but this and the other two generated pages are content
     lists/cards, which just look stretched and empty at 2000px+. The three pages share this
     cap (and the --cfg-* colors above) so they read as one family; the configurator is allowed
     to be a different shape because it does a different job. */
  .wrap { max-width: 1200px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--cfg-muted); text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { color: var(--cfg-text); }
  /* Same wordmark treatment as the configurator's "ALARIC DS" title (design.md): brand name +
     page name, uppercase, spaced out. CSS text-transform, not literal caps, so it still works
     for whatever PROJECT_NAME a downstream project's own CLAUDE.md gives it. */
  h1 { font-size: 1.9rem; font-weight: 600; margin: 0 0 24px; text-transform: uppercase; letter-spacing: 0.24em; }
  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .summary-pill {
    background: var(--cfg-surface);
    border: 1px solid var(--cfg-border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    color: var(--cfg-muted);
    cursor: pointer;
    user-select: none;
  }
  .summary-pill strong { color: var(--cfg-text); }
  .summary-pill.active { background: var(--cfg-text); border-color: var(--cfg-text); color: var(--cfg-bg); }
  .summary-pill.active strong { color: inherit; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .controls input {
    background: var(--cfg-surface);
    border: 1px solid var(--cfg-border);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 0.9rem;
    color: var(--cfg-text);
    font-family: var(--cfg-font);
  }
  #q { flex: 1; min-width: 180px; }
  #file { width: 200px; }
  #from, #to { width: 140px; }
  .count { font-size: 0.85rem; color: var(--cfg-muted); margin-bottom: 12px; }
  .commit {
    background: var(--cfg-surface);
    border: 1px solid var(--cfg-border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .commit-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .commit-date { font-family: var(--mono); font-size: 0.8rem; color: var(--cfg-muted); }
  .commit-subject { font-weight: 500; flex: 1; min-width: 200px; }
  .commit-hash { font-family: var(--mono); font-size: 0.75rem; color: var(--cfg-muted); }
  .badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--cfg-bg); /* dark text: the category colours are light on the dark pages */
    font-weight: 500;
  }
  .badge-frontend { background: var(--cat-frontend); }
  .badge-logic { background: var(--cat-logic); }
  .badge-content { background: var(--cat-content); }
  .badge-backend { background: var(--cat-backend); }
  .badge-tooling { background: var(--cat-tooling); }
  .files-toggle {
    font-size: 0.75rem;
    color: var(--cfg-muted);
    cursor: pointer;
    margin-top: 6px;
    display: inline-block;
  }
  .files-list {
    display: none;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--cfg-muted);
    white-space: pre-wrap;
  }
  .files-list.open { display: block; }
  .empty { color: var(--cfg-muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="dashboard.html">&larr; Dashboard</a>
  <h1 id="page-title">Git History</h1>
  <div class="summary" id="summary"></div>
  <div class="controls">
    <input id="q" type="text" placeholder="search messages..." />
    <input id="file" type="text" placeholder="file..." />
    <input id="from" type="date" />
    <input id="to" type="date" />
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
const PROJECT_NAME = /*__PROJECT_NAME__*/;
const COMMITS = /*__COMMITS_JSON__*/;
const CATEGORIES = ['frontend', 'logic', 'content', 'backend', 'tooling'];
document.getElementById('page-title').textContent = `${PROJECT_NAME} Git History`;

const state = { q: '', file: '', from: '', to: '', categories: new Set(), types: new Set() };

function typeCounts() {
  const counts = {};
  COMMITS.forEach((c) => { if (c.type) counts[c.type] = (counts[c.type] || 0) + 1; });
  return counts;
}

function categoryCounts() {
  const counts = {};
  CATEGORIES.forEach((cat) => { counts[cat] = 0; });
  COMMITS.forEach((c) => c.categories.forEach((cat) => { counts[cat] = (counts[cat] || 0) + 1; }));
  return counts;
}

function renderSummary() {
  const el = document.getElementById('summary');
  const catCounts = categoryCounts();
  el.innerHTML = CATEGORIES.map((cat) => {
    const active = state.categories.has(cat) ? 'active' : '';
    return `<div class="summary-pill ${active}" data-cat="${cat}"><strong>${catCounts[cat]}</strong> ${cat}</div>`;
  }).join('');
  el.querySelectorAll('.summary-pill').forEach((pill) => {
    pill.addEventListener('click', () => {
      const cat = pill.dataset.cat;
      if (state.categories.has(cat)) state.categories.delete(cat);
      else state.categories.add(cat);
      render();
    });
  });
}

function matches(c) {
  if (state.q) {
    const hay = (c.subject + ' ' + c.body).toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  if (state.file) {
    const f = state.file.toLowerCase();
    if (!c.files.some((path) => path.toLowerCase().includes(f))) return false;
  }
  if (state.from && c.date < state.from) return false;
  if (state.to && c.date > state.to) return false;
  if (state.categories.size > 0) {
    if (!c.categories.some((cat) => state.categories.has(cat))) return false;
  }
  return true;
}

function render() {
  renderSummary();
  const filtered = COMMITS.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} of ${COMMITS.length} commits`;
  const list = document.getElementById('list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No commit matches.</div>';
    return;
  }
  list.innerHTML = filtered.map((c, i) => {
    const badges = c.categories.map((cat) => `<span class="badge badge-${cat}">${cat}</span>`).join('');
    const filesList = c.files.map((f) => escapeHtml(f)).join('\n');
    return `
      <div class="commit">
        <div class="commit-head">
          <span class="commit-date">${c.date}</span>
          <span class="commit-subject">${escapeHtml(c.subject)}</span>
          <span class="commit-hash">${c.short}</span>
        </div>
        <div class="badges">${badges}</div>
        <div class="files-toggle" data-idx="${i}">${c.files.length} files &rsaquo;</div>
        <div class="files-list" id="files-${i}">${filesList}</div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.files-toggle').forEach((el) => {
    el.addEventListener('click', () => {
      document.getElementById('files-' + el.dataset.idx).classList.toggle('open');
    });
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
document.getElementById('file').addEventListener('input', (e) => { state.file = e.target.value; render(); });
document.getElementById('from').addEventListener('input', (e) => { state.from = e.target.value; render(); });
document.getElementById('to').addEventListener('input', (e) => { state.to = e.target.value; render(); });

render();
</script>
</body>
</html>
